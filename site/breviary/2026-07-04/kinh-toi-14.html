    <p class="updated">Kinh Tối 14/14</p>

    <p class="split-block">Và sau đời khổ ải,<br/>Xin Bà khứng tỏ ra<br/>Cho đoàn con được thấy</p>
<p class="split-block">Quả phúc bởi lòng Bà :<br/>Đức Giê-su khả ái.</p>
<p>Ôi lượng cả khoan hồng,<br/>
        Ôi tấm lòng xót thương,<br/>
        Ôi dịu hiền nhân hậu,<br/>
        Trinh Nữ Ma-ri-a.</p>
