    <p class="title">Kính chào Đức Nữ Vương <span>(Salve Regina)</span></p>
<p><span class="illuminated-initial">K</span>ính chào Đức Nữ Vương,<br/>
        Bà là Mẹ xót thương,<br/>
        Ngọt ngào cho cuộc sống,<br/>
        Kính chào Lẽ Cậy Trông !</p>
<p class="split-block">Này con cháu E-và,<br/>Thân phận người lưu lạc,<br/>Chúng con ngửa trông Bà,</p>
<p class="split-block">Kêu Bà mà khóc lóc,<br/>Than thở với rên la<br/>Trong lũng đầy nước mắt.</p>
