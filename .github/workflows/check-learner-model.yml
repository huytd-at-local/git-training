name: Check learner model
on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        default: gemini-3.6-flash
      scope:
        description: Sample or complete cold-cache daily workload (no deploy)
        type: choice
        options:
          - sample
          - full-day
        default: sample
      date:
        description: YYYY-MM-DD; empty means today in Vietnam
        required: false
        default: ''
      ipa_prompt:
        description: Production baseline or isolated conservative candidate
        type: choice
        options:
          - baseline
          - conservative
        default: baseline
      ipa_batch_size:
        description: IPA items per request; isolated qualification only
        type: choice
        options:
          - '150'
          - '75'
        default: '150'
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_learner_model.py --scope "$QUALIFICATION_SCOPE" --date "$QUALIFICATION_DATE" --ipa-prompt "$QUALIFICATION_IPA_PROMPT" --ipa-batch-size "$QUALIFICATION_IPA_BATCH_SIZE"
        env:
          QUALIFICATION_SCOPE: ${{ inputs.scope || 'sample' }}
          QUALIFICATION_DATE: ${{ inputs.date }}
          QUALIFICATION_IPA_PROMPT: ${{ inputs.ipa_prompt || 'baseline' }}
          QUALIFICATION_IPA_BATCH_SIZE: ${{ inputs.ipa_batch_size || '150' }}
          BREVIARY_LEARNER_GEMINI_API_KEY: ${{ secrets.BREVIARY_LEARNER_GEMINI_API_KEY }}
          BREVIARY_LEARNER_GEMINI_MODEL: ${{ inputs.model }}
