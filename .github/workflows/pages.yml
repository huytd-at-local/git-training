name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore English learner language cache
        uses: actions/cache@v4
        with:
          path: .cache/breviary-learner-language-v2.json
          key: breviary-learner-v2-${{ github.run_id }}
          restore-keys: |
            breviary-learner-v2-

      - name: Generate static site
        run: python scripts/fetch.py
        env:
          BREVIARY_EN_PASSCODE: ${{ secrets.BREVIARY_EN_PASSCODE }}
          BREVIARY_LEARNER_GEMINI_API_KEY: ${{ secrets.BREVIARY_LEARNER_GEMINI_API_KEY }}
          BREVIARY_LEARNER_GEMINI_MODEL: gemini-2.5-flash-lite

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
