name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 00:23 Vietnam time, away from the top-of-hour scheduling surge.
    - cron: "23 17 * * *"
    # One recovery opportunity for transient source or build failures.
    - cron: "17 18 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          pip install -r requirements.txt

      - name: Find the previous successful Pages artifact
        id: previous-pages
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              status: 'success',
              per_page: 20,
            });
            for (const run of response.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const pages = artifacts.data.artifacts.find(
                (artifact) => artifact.name === 'github-pages' && !artifact.expired
              );
              if (pages) {
                core.setOutput('run-id', String(run.id));
                return;
              }
            }
            core.warning('No unexpired Pages artifact is available; using the committed English fallback.');

      - name: Download the last successful Pages artifact
        if: steps.previous-pages.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.previous-pages.outputs.run-id }}
          github-token: ${{ github.token }}
          path: build/previous-pages-artifact

      - name: Seed last-known-good English editions
        if: steps.previous-pages.outputs.run-id != ''
        run: |
          archive=$(find build/previous-pages-artifact -name artifact.tar -print -quit)
          test -n "$archive"
          mkdir -p build/previous-pages site/breviary
          tar -xf "$archive" -C build/previous-pages
          test -f build/previous-pages/breviary/en/index.html
          rm -rf site/breviary/en
          cp -R build/previous-pages/breviary/en site/breviary/

      - name: Generate static site
        run: python scripts/fetch.py
        env:
          BREVIARY_EN_PASSCODE: ${{ secrets.BREVIARY_EN_PASSCODE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
