name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore English learner language cache
        uses: actions/cache@v4
        with:
          path: .cache/breviary-learner-language-v3.json
          key: breviary-learner-v3-${{ github.run_id }}
          restore-keys: |
            breviary-learner-v3-

      - name: Restore encrypted English learner edition
        id: learner-edition-cache
        uses: actions/cache@v4
        with:
          path: site/breviary/en/learner
          key: breviary-learner-edition-v1-${{ github.run_id }}
          restore-keys: |
            breviary-learner-edition-v1-

      - name: Check whether the learner edition was restored
        id: learner-edition
        run: |
          if test -f site/breviary/en/learner/index.html; then
            echo "needs-seed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs-seed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the previous successful Pages artifact
        id: previous-pages
        if: steps.learner-edition.outputs.needs-seed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              status: 'success',
              per_page: 1,
            });
            const run = response.data.workflow_runs[0];
            if (!run) {
              core.setFailed('No successful Pages artifact is available to seed the learner edition.');
              return;
            }
            core.setOutput('run-id', String(run.id));

      - name: Seed encrypted learner edition from Pages artifact
        if: steps.learner-edition.outputs.needs-seed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.previous-pages.outputs.run-id }}
          github-token: ${{ github.token }}
          path: build/previous-pages-artifact

      - name: Extract preserved learner edition
        if: steps.learner-edition.outputs.needs-seed == 'true'
        run: |
          archive=$(find build/previous-pages-artifact -name artifact.tar -print -quit)
          test -n "$archive"
          mkdir -p build/previous-pages site/breviary/en
          tar -xf "$archive" -C build/previous-pages
          test -f build/previous-pages/breviary/en/learner/index.html
          cp -R build/previous-pages/breviary/en/learner site/breviary/en/

      - name: Generate static site
        run: python scripts/fetch.py
        env:
          BREVIARY_EN_PASSCODE: ${{ secrets.BREVIARY_EN_PASSCODE }}
          BREVIARY_LEARNER_GEMINI_API_KEY: ${{ secrets.BREVIARY_LEARNER_GEMINI_API_KEY }}
          BREVIARY_LEARNER_GEMINI_MODEL: gemini-3.6-flash
          # A push commonly changes only presentation code. Reuse the encrypted
          # learner edition then; scheduled/manual runs refresh today's guides.
          BREVIARY_REFRESH_LEARNER: ${{ github.event_name != 'push' && '1' || '0' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
